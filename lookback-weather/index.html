<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>蓦然回首 · 实时天气与真实日照</title>
<style>
	html, body {
		margin: 0;
		padding: 0;
		width: 100%;
		height: 100%;
		overflow: hidden;
		background: #05070c;
		cursor: none;
	}
	/* 3D 外景垫在底下，2D 房间画在上面，靠 alpha 自然合成 */
	#gl { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; display: none; }
	#stage { position: fixed; inset: 0; display: block; z-index: 1;
	         width: 100vw; height: 100vh; }
	#hud {
		position: fixed;
		left: 12px;
		bottom: 12px;
		font: 12px/1.55 ui-monospace, Menlo, Consolas, monospace;
		color: #cfe0ff;
		background: rgba(6, 10, 18, .62);
		border: 1px solid rgba(150, 190, 255, .22);
		border-radius: 6px;
		padding: 8px 11px;
		white-space: pre;
		pointer-events: none;
		display: none;
		text-shadow: 0 1px 2px #000;
	}
	#hud.on { display: block; }
	#err {
		position: fixed; inset: 0; display: none; place-items: center;
		color: #ffb4b4; font: 14px/1.7 ui-monospace, monospace;
		text-align: center; padding: 40px;
	}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="stage"></canvas>
<div id="hud"></div>
<div id="err"></div>

<!-- Wallpaper Engine Web 壁纸跑在 file:// 下，不能用 ES module，只能经典 script -->
<script src="js/vendor/three.min.js"></script>
<script src="js/config.js"></script>
<script src="js/sun.js"></script>
<script src="js/weather.js"></script>
<script src="js/scene.js"></script>
<script src="js/particles.js"></script>
<script src="js/sunshade.js"></script>
<script src="js/city3d.js"></script>
<script src="js/render.js"></script>
<script src="js/text.js"></script>
<script src="js/panel.js"></script>
<script src="js/main.js"></script>
</body>
</html>
